<rect x="760" y="80" width="205" height="145" fill="#ffffff" stroke="#aaa397" stroke-width="1.5"/><rect x="760" y="80" width="6" height="145" fill="#394a62"/>
<rect x="275" y="380" width="245" height="125" fill="#ffffff" stroke="#aaa397" stroke-width="1.5"/><rect x="275" y="380" width="6" height="125" fill="#81796f"/>
<rect x="760" y="380" width="205" height="125" fill="#ffffff" stroke="#aaa397" stroke-width="1.5"/><rect x="760" y="380" width="6" height="125" fill="#394a62"/>
<path d="M 215 250 H 245 V 150 H 275" fill="none" stroke="#697487" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 470 150 H 515" fill="none" stroke="#697487" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 720 150 H 760" fill="none" stroke="#697487" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 862 225 V 380" fill="none" stroke="#697487" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#arrow)"/>
<path d="M 215 290 H 245 V 440 H 275" fill="none" stroke="#81796f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bypass-arrow)"/>
<path d="M 520 440 H 760" fill="none" stroke="#81796f" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bypass-arrow)"/>
<text x="62" y="241" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="1">INPUT</text>
<text x="62" y="270" fill="#292721" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Decode μ-law</text>
<text x="62" y="296" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">160 bytes / 20 ms</text>
<text x="297" y="106" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="1">FRAME ANALYSIS</text>
<text x="297" y="135" fill="#292721" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">High-pass + STFT</text>
<text x="297" y="161" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">256-sample analysis</text>
<text x="297" y="181" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">128 / 80 sample hop</text>
<text x="537" y="106" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="1">NOISE AND GAIN</text>
<text x="537" y="135" fill="#292721" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Noise + Log-MMSE</text>
<text x="537" y="161" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">SPP-MMSE default</text>
<text x="537" y="181" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">MCRA / minimum</text>
<text x="782" y="106" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="1">SYNTHESIS</text>
<text x="782" y="135" fill="#292721" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Tonal + inverse FFT</text>
<text x="782" y="161" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">all estimators</text>
<text x="782" y="181" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">full / short synthesis</text>
<text x="297" y="406" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="1">QUIET INTRO</text>
<text x="297" y="435" fill="#292721" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Original PCM bypass</text>
<text x="297" y="461" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">frames before cutoff</text>
<text x="297" y="481" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">complete windows learn noise</text>
<text x="782" y="406" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="11.5" font-weight="700" letter-spacing="1">OUTPUT</text>
<text x="782" y="435" fill="#292721" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="17" font-weight="700">Encode + batch</text>
<text x="782" y="461" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">0–2 whole packets</text>
<text x="782" y="481" fill="#625d53" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="13">finish: final valid count</text>
<rect x="275" y="36" width="360" height="21" fill="#fffdf7"/><text x="280" y="52" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.8">ANALYZE ALWAYS · GAIN AFTER INTRO</text>
<rect x="275" y="336" width="228" height="21" fill="#fffdf7"/><text x="280" y="352" fill="#6d665b" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" letter-spacing="0.8">QUIET-INTRO OUTPUT</text>
</svg>
