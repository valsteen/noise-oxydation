<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="565" viewBox="0 0 1000 565" role="img" aria-labelledby="title description">
<title id="title">Packet enhancement and quiet-intro bypass</title>
<desc id="description">One 160-byte mu-law packet is decoded. High-pass and 256-point STFT use 128-sample conservative or 80-sample experimental hops. After learning, selected noise estimation, Log-MMSE, tonal gain and synthesis feed encoded output. During quiet-intro learning, original decoded audio bypasses suppression.</desc>
<defs><pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse"><path d="M 24 0 H 0 V 24" fill="none" stroke="#e8e1d5" stroke-width="1"/></pattern><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#697487"/></marker><marker id="bypass-arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto" markerUnits="userSpaceOnUse"><path d="M 0 0 L 10 5 L 0 10 Z" fill="#81796f"/></marker></defs>
<rect width="1000" height="565" fill="#fffdf7"/><rect width="1000" height="565" fill="url(#grid)"/><rect x="1" y="1" width="998" height="563" fill="none" stroke="#cec7b9" stroke-width="2"/>
<rect x="40" y="215" width="175" height="110" fill="#ffffff" stroke="#aaa397" stroke-width="1.5"/><rect x="40" y="215" width="6" height="110" fill="#394a62"/>
<rect x="275" y="80" width="195" height="145" fill="#ffffff" stroke="#aaa397" stroke-width="1.5"/><rect x="275" y="80" width="6" height="145" fill="#394a62"/>
