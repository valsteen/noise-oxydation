name: Rust CI

on:
  pull_request:
  push:
    branches:
      - luna
      - luna-go-integration

jobs:
  checks:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.6
          check-latest: false
          cache: false
      - name: Install accepted Rust toolchains
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component clippy
          rustup toolchain install nightly-2026-09-25 --profile minimal --component rustfmt
      - name: Check formatting
        run: cargo +nightly-2026-09-25 fmt --all -- --check
      - name: Run Clippy
        run: cargo +1.98.1 clippy --workspace --all-targets --locked -- -D warnings -D clippy::pedantic
      - name: Run tests
        run: cargo +1.98.1 test --workspace --locked
      - name: Build workspace
        run: cargo +1.98.1 build --workspace --locked
      - name: Build Rust static archive
        run: cargo +1.98.1 build --release --locked --package noise-oxydation-ffi
      - name: Test Go package, example, and measurement command
        working-directory: bindings/go
        env:
          CGO_ENABLED: 1
        run: go test ./...
      - name: Build Go package, example, and measurement command
        working-directory: bindings/go
        env:
          CGO_ENABLED: 1
        run: go build ./...
