  <text x="24" y="44" class="section-label canvas-text">TOOLS</text><text x="24" y="252" class="section-label canvas-text">CORE</text><text x="24" y="452" class="section-label canvas-text">EXTERNAL</text><text x="188" y="434" text-anchor="middle" class="connector-label canvas-text">OPTIONAL</text><text x="40" y="82" class="box-label">BINARY · CRATES/TOOLS</text><text x="40" y="109" class="box-title">noise-oxydation-eval</text><text x="40" y="130" class="box-body">replays real speech, compares outputs,</text><text x="40" y="151" class="box-body">benchmarks the packet path</text><text x="40" y="194" class="box-meta">crates/tools/noise-oxydation-eval</text><text x="400" y="82" class="box-label">BINARY · CRATES/TOOLS</text><text x="400" y="109" class="box-title">how-it-works</text><text x="400" y="130" class="box-body">generates this guide and</text><text x="400" y="151" class="box-body">its day and night diagrams</text><text x="400" y="172" class="box-body">std only, no dependencies</text><text x="400" y="194" class="box-meta">crates/tools/how-it-works</text><text x="640" y="82" class="box-label">GO MODULE · EVIDENCE</text><text x="640" y="109" class="box-title">go-parity</text><text x="640" y="130" class="box-body">runs the Go reference for</text><text x="640" y="151" class="box-body">parity and timing evidence</text><text x="640" y="172" class="box-body">outside the Cargo workspace</text><text x="640" y="194" class="box-meta">tools/go-parity</text><text x="40" y="298" class="box-label">LIBRARY · CRATES/CORE</text><text x="40" y="325" class="box-title">noise-oxydation</text><text x="40" y="346" class="box-body">one CallEnhancer per call</text><text x="40" y="367" class="box-body">every DSP stage is a module</text><text x="40" y="390" class="box-meta">crates/core/noise-oxydation</text><text x="40" y="498" class="box-label">CRATE · OPTIONAL</text><text x="40" y="525" class="box-title">log 0.4</text><text x="40" y="546" class="box-body">facade behind the log feature</text><text x="328" y="498" class="box-label">CRATE</text><text x="328" y="525" class="box-title">hound 3.5</text><text x="328" y="546" class="box-body">WAV reading and writing</text><text x="592" y="498" class="box-label">GO MODULE · REFERENCE</text><text x="592" y="525" class="box-title">noise-cancelation</text><text x="592" y="546" class="box-body">sghaida, pinned at cfc7520</text><text x="592" y="570" class="box-meta">v0.0.0-20260920200827-cfc7520a0625</text><text x="360" y="316" text-anchor="start" class="note canvas-text">Arrows point from a crate to what it depends on.</text><text x="360" y="338" text-anchor="start" class="note canvas-text">Tools depend on the library, never the reverse.</text><text x="360" y="368" text-anchor="start" class="note canvas-text">go-parity drives the Go reference; nothing in the</text><text x="360" y="386" text-anchor="start" class="note canvas-text">workspace depends on it.</text>
