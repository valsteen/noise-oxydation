<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 880 684">
  <title id="title">The timeline of one call</title>
  <desc id="description">A call starts with CallEnhancer::new. Packets 1 and 2 return Priming and produce no output. From packet 3 on, every packet returns one enhanced packet carrying the input of two packets earlier. Drain returns the two withheld packets, and reset starts the next call on the same instance. With the 5 s default, frames 0 to 310 are calibration frames that pass through un-enhanced while the noise is learned; frame 311, starting at 4.976 s, is the first enhanced frame.</desc>
