  <text x="24" y="44" class="section-label canvas-text">PACKETS · WHAT THE CALLER SEES</text><text x="24" y="452" class="section-label canvas-text">CALIBRATION CLOCK · 5-SECOND DEFAULT</text><text x="774" y="234" text-anchor="middle" class="connector-label canvas-text">LAST PACKET</text><text x="220" y="314" text-anchor="middle" class="connector-label canvas-text">SAME INSTANCE</text><text x="40" y="90" class="box-label">CALL STARTS</text><text x="40" y="117" class="box-title">CallEnhancer::new</text><text x="40" y="138" class="box-body">validates the configuration</text><text x="40" y="159" class="box-body">sizes every buffer once</text><text x="40" y="180" class="box-body">the only step that allocates</text><text x="312" y="90" class="box-label">PACKETS 1 AND 2</text><text x="312" y="117" class="box-title">Priming</text><text x="312" y="138" class="box-body">no output yet: two packets</text><text x="312" y="159" class="box-body">are withheld (40 ms)</text><text x="312" y="182" class="box-meta">PacketOutcome::Priming</text><text x="600" y="90" class="box-label">PACKET 3 ONWARD</text><text x="600" y="117" class="box-title">One packet out per in</text><text x="600" y="138" class="box-body">output n carries input n − 2</text><text x="600" y="182" class="box-meta">PacketOutcome::Emitted</text><text x="600" y="286" class="box-label">END OF CALL</text><text x="600" y="313" class="box-title">drain</text><text x="600" y="334" class="box-body">returns the two withheld packets</text><text x="600" y="355" class="box-body">total output = total input</text><text x="600" y="378" class="box-meta">then StreamError::Drained</text><text x="312" y="286" class="box-label">NEXT CALL</text><text x="312" y="313" class="box-title">reset</text><text x="312" y="334" class="box-body">clears every stage in place</text><text x="312" y="355" class="box-body">restarts the calibration clock</text><text x="312" y="378" class="box-meta">no allocation</text><text x="40" y="494" class="box-label">FRAMES 0–310</text><text x="40" y="521" class="box-title">Calibrating: learn the noise</text><text x="40" y="542" class="box-body">0 to 4.976 s: the estimator averages the power spectrum</text><text x="40" y="563" class="box-body">audio passes through, high-pass filtered only</text><text x="40" y="586" class="box-meta">CallPhase::Calibrating</text><text x="568" y="494" class="box-label">FRAME 311 ONWARD</text><text x="568" y="521" class="box-title">Enhancing</text><text x="568" y="542" class="box-body">from 4.976 s: adaptive noise tracking</text><text x="568" y="563" class="box-body">Log-MMSE and tonal suppression</text><text x="568" y="586" class="box-meta">CallPhase::Enhancing</text><text x="24" y="632" text-anchor="start" class="note canvas-text">A frame is a calibration frame when it ends by 5 s: 128·t + 256 ≤ 40 000 samples.</text><text x="24" y="654" text-anchor="start" class="note canvas-text">Frame 311 starts at sample 39 808 (4.976 s). Not to scale: priming lasts 40 ms.</text>
</svg>
