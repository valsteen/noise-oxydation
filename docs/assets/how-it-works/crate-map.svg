<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 880 824">
  <title id="title">Crate map</title>
  <desc id="description">The Go modules, the workspace crates grouped into tools and bindings and core, and their external dependencies. The noiseox Go package links the noise-oxydation-capi static library through cgo, and the C ABI crate depends on the library with its default features off. The evaluation tool depends on the library and on hound; the library depends only on the optional log facade; the guide renderer has no dependency. The go-parity harness depends on the pinned Go reference module. Arrows point from a crate or module to what it depends on.</desc>
