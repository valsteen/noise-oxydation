  <text x="24" y="44" class="section-label canvas-text">GO MODULES</text><text x="24" y="252" class="section-label canvas-text">TOOLS AND BINDINGS</text><text x="24" y="468" class="section-label canvas-text">CORE</text><text x="24" y="668" class="section-label canvas-text">EXTERNAL CRATES</text><text x="206" y="232" text-anchor="middle" class="connector-label canvas-text">CGO, STATIC</text><text x="232" y="448" text-anchor="middle" class="connector-label canvas-text">NO DEFAULT FEATURES</text><text x="188" y="650" text-anchor="middle" class="connector-label canvas-text">OPTIONAL</text><text x="40" y="82" class="box-label">GO PACKAGE · GO/</text><text x="40" y="109" class="box-title">noiseox</text><text x="40" y="130" class="box-body">one Call per call, cgo hidden</text><text x="40" y="151" class="box-body">no allocation per packet</text><text x="40" y="180" class="box-meta">github.com/valsteen/</text><text x="40" y="194" class="box-meta">noise-oxydation-claude/go</text><text x="352" y="82" class="box-label">GO MODULE · EVIDENCE</text><text x="352" y="109" class="box-title">go-parity</text><text x="352" y="130" class="box-body">runs the Go reference for</text><text x="352" y="151" class="box-body">parity and timing evidence</text><text x="352" y="194" class="box-meta">tools/go-parity</text><text x="608" y="82" class="box-label">GO MODULE · REFERENCE</text><text x="608" y="109" class="box-title">noise-cancelation</text><text x="608" y="130" class="box-body">sghaida, pinned at cfc7520</text><text x="608" y="194" class="box-meta">v0.0.0-20260920200827-cfc7520a0625</text><text x="40" y="298" class="box-label">STATIC LIBRARY</text><text x="40" y="325" class="box-title">noise-oxydation-capi</text><text x="40" y="346" class="box-body">C ABI of the per-call packet API</text><text x="40" y="367" class="box-body">its unsafe code stays in this crate</text><text x="40" y="410" class="box-meta">crates/bindings/noise-oxydation-capi</text><text x="352" y="298" class="box-label">BINARY · CRATES/TOOLS</text><text x="352" y="325" class="box-title">noise-oxydation-eval</text><text x="352" y="346" class="box-body">replays real speech, compares</text><text x="352" y="367" class="box-body">outputs, benchmarks packets</text><text x="352" y="410" class="box-meta">crates/tools/noise-oxydation-eval</text><text x="640" y="298" class="box-label">BINARY · CRATES/TOOLS</text><text x="640" y="325" class="box-title">how-it-works</text><text x="640" y="346" class="box-body">generates this guide and</text><text x="640" y="367" class="box-body">its day and night diagrams</text><text x="640" y="388" class="box-body">std only, no dependencies</text><text x="640" y="410" class="box-meta">crates/tools/how-it-works</text><text x="40" y="514" class="box-label">LIBRARY · CRATES/CORE</text><text x="40" y="541" class="box-title">noise-oxydation</text><text x="40" y="562" class="box-body">one CallEnhancer per call</text><text x="40" y="583" class="box-body">every DSP stage is a module</text><text x="40" y="606" class="box-meta">crates/core/noise-oxydation</text><text x="40" y="714" class="box-label">CRATE · OPTIONAL</text><text x="40" y="741" class="box-title">log 0.4</text><text x="40" y="762" class="box-body">facade behind the log feature</text><text x="352" y="714" class="box-label">CRATE</text><text x="352" y="741" class="box-title">hound 3.5</text><text x="352" y="762" class="box-body">WAV reading and writing</text><text x="472" y="516" text-anchor="start" class="note canvas-text">Arrows point from a crate or module to what it</text><text x="472" y="534" text-anchor="start" class="note canvas-text">depends on. Tools and bindings depend on the</text><text x="472" y="552" text-anchor="start" class="note canvas-text">library, never the reverse.</text><text x="472" y="582" text-anchor="start" class="note canvas-text">go-parity drives the Go reference; nothing in the</text><text x="472" y="600" text-anchor="start" class="note canvas-text">workspace depends on it.</text>
</svg>
