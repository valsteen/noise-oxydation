<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title description" viewBox="0 0 880 1116">
  <title id="title">How one call processes a packet</title>
  <desc id="description">Inside one call every stage runs in order on the caller&#39;s thread: mu-law decode, high-pass filter and the analysis buffer for each packet, then for each frame the power spectrum, the noise estimator in calibration or adaptive mode, the tonal detector on the original power, Log-MMSE with decision-directed SNR, the combined per-bin gains, synthesis, and mu-law encoding into the output queue. Calibration frames skip steps 6 to 8. Independent calls run in parallel, each with its own CallEnhancer and no shared state.</desc>
