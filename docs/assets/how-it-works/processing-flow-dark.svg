t x="24" y="612" width="3" height="108" fill="#91a7bb"/><rect x="24" y="776" width="248" height="108" class="box"/><rect x="24" y="776" width="3" height="108" fill="#91a7bb"/><rect x="316" y="776" width="248" height="108" class="box"/><rect x="316" y="776" width="3" height="108" fill="#9b948b"/><rect x="24" y="984" width="248" height="108" class="box"/><rect x="24" y="984" width="3" height="108" fill="#91a7bb"/><rect x="316" y="984" width="248" height="108" class="box"/><rect x="316" y="984" width="3" height="108" fill="#91a7bb"/><rect x="608" y="984" width="248" height="108" class="box"/><rect x="608" y="984" width="3" height="108" fill="#91a7bb"/>
  <text x="24" y="40" class="section-label canvas-text">ONE CALL · EVERY STEP RUNS IN ORDER ON THE CALLER&#39;S THREAD</text><text x="24" y="62" class="section-subtitle canvas-text">Steps 1–3 run for each 160-byte packet; steps 4–10 for each 256-sample frame, which a packet completes 0, 1 or 2 times.</text><text x="24" y="940" class="section-label canvas-text">ACROSS CALLS · INDEPENDENT CALLS RUN IN PARALLEL</text><text x="24" y="962" class="section-subtitle canvas-text">Each call owns one CallEnhancer holding all of its state. Calls share no state, locks or atomics.</text><text x="770" y="232" text-anchor="middle" class="connector-label canvas-text">FRAME</text><text x="792" y="412" text-anchor="middle" class="connector-label canvas-text">ORIGINAL P</text><text x="488" y="412" text-anchor="middle" class="connector-label canvas-text">NOISE N</text><text x="484" y="588" text-anchor="middle" class="connector-label canvas-text">GAIN G</text><text x="648" y="652" text-anchor="middle" class="connector-label canvas-text">TONAL GAIN</text><text x="182" y="306" text-anchor="middle" class="connector-label canvas-text">CALIBRATION FRAMES</text><text x="40" y="118" class="box-label">1 · PER PACKET</text><text x="40" y="145" class="box-title">μ-law decode</text><text x="40" y="166" class="box-body">160 bytes → 160 samples</text><text x="332" y="118" class="box-label">2 · PER PACKET</text><text x="332" y="145" class="box-title">High-pass filter</text><text x="332" y="166" class="box-body">80 Hz, removes DC and rumble</text><text x="624" y="118" class="box-label">3 · PER PACKET</text><text x="624" y="145" class="box-title">Analysis buffer</text><text x="624" y="166" class="box-body">releases a 256-sample frame</text><text x="624" y="187" class="box-body">every 128 samples</text><text x="624" y="274" class="box-label">4 · PER FRAME</text><text x="624" y="301" class="box-title">Power spectrum</text><text x="624" y="322" class="box-body">Hann window, 256-point FFT</text><text x="624" y="343" class="box-body">P = |X|² in 129 bins</text><text x="332" y="274" class="box-label">5 · PER FRAME</text><text x="332" y="301" class="box-title">Noise estimator</text><text x="332" y="322" class="box-body">calibration: averages P</text><text x="332" y="343" class="box-body">adaptive: SPP-MMSE, MCRA</text><text x="332" y="364" class="box-body">or minimum tracking</text><text x="624" y="458" class="box-label">6 · IF ENABLED</text><text x="624" y="485" class="box-title">Tonal detector</text><text x="624" y="506" class="box-body">reads P before suppression</text><text x="624" y="527" class="box-body">scores beeps and whistles</text><text x="332" y="458" class="box-label">7 · PER FRAME</text><text x="332" y="485" class="box-title">Log-MMSE</text><text x="332" y="506" class="box-body">decision-directed SNR</text><text x="332" y="527" class="box-body">gain per bin, floor −26 dB</text><text x="332" y="634" class="box-label">8 · PER BIN</text><text x="332" y="661" class="box-title">Combine the gains</text><text x="332" y="682" class="box-body">X · G · tonal gain</text><text x="332" y="703" class="box-body">tonal gain within [0, 1]</text><text x="40" y="634" class="box-label">9 · PER FRAME</text><text x="40" y="661" class="box-title">Synthesis</text><text x="40" y="682" class="box-body">inverse FFT, overlap-add</text><text x="40" y="703" class="box-body">finalizes 128 samples</text><text x="40" y="798" class="box-label">10 · PER FRAME</text><text x="40" y="825" class="box-title">μ-law encode, queue</text><text x="40" y="846" class="box-body">bounded ring buffer of</text><text x="40" y="867" class="box-body">finished output bytes</text><text x="332" y="798" class="box-label">RETURNED TO THE CALLER</text><text x="332" y="825" class="box-title">Enhanced packet</text><text x="332" y="846" class="box-body">one per packet in, from packet 3</text><text x="332" y="867" class="box-body">40 ms behind its input</text><text x="40" y="1006" class="box-label">THREAD 1</text><text x="40" y="1033" class="box-title">Call A</text><text x="40" y="1054" class="box-body">its own CallEnhancer</text><text x="40" y="1075" class="box-body">runs steps 1–10 in order</text><text x="332" y="1006" class="box-label">THREAD 2</text><text x="332" y="1033" class="box-title">Call B</text><text x="332" y="1054" class="box-body">its own CallEnhancer</text><text x="332" y="1075" class="box-body">runs steps 1–10 in order</text><text x="624" y="1006" class="box-label">ANY THREAD OR TASK</text><text x="624" y="1033" class="box-title">Call N</text><text x="624" y="1054" class="box-body">its own CallEnhancer</text><text x="624" y="1075" class="box-body">runs steps 1–10 in order</text><text x="64" y="420" text-anchor="start" class="note canvas-text">Frames 0–310 of a 5 s</text><text x="64" y="438" text-anchor="start" class="note canvas-text">calibration skip steps</text><text x="64" y="456" text-anchor="start" class="note canvas-text">6–8: the audio passes</text><text x="64" y="474" text-anchor="start" class="note canvas-text">through un-enhanced.</text><text x="608" y="812" text-anchor="start" class="note canvas-text">Steps 6 and 7 are independent</text><text x="608" y="830" text-anchor="start" class="note canvas-text">inputs, combined per bin in</text><text x="608" y="848" text-anchor="start" class="note canvas-text">step 8. They run one after the</text><text x="608" y="866" text-anchor="start" class="note canvas-text">other, not concurrently.</text>
</svg>
